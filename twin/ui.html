function showCheck(j){if(j.error){$('#out').innerHTML=`<p style="margin-top:60px">${esc(j.error)}</p>`;return}const bad=j.results.filter(r=>!r.passed);hold=j.passed?0:.6;glitch=j.passed?0:1;
 $('#out').innerHTML=`<div class="big" style="color:${j.passed?'var(--fg)':'var(--sig)'}">${j.passed?'You.':'Not you.'}</div>`+(bad.map(r=>`<div class="f"><b>${esc([...new Set((r.hits||[]).map(h=>h.match||'').filter(Boolean))].slice(0,6).join(', ')||r.id.replace(/-/g,' '))}</b><p>${esc(r.suggestion||r.message||'')}</p><span class="k">${r.severity==='error'?'Fails':'Warning'}${(r.hits||[]).length?' · line '+[...new Set(r.hits.map(h=>h.line))].join(', '):''}</span></div>`).join('')||'')+`<p class="fine">${j.results.length-bad.length} of ${j.results.length} rules pass</p>`}
function openCheck(pre){sheet(K('Check a draft')+`<h1>Does it sound like you?</h1><textarea id="dr" placeholder="Paste a draft. Yours or an AI's."></textarea><div class="acts"><button class="go" id="bc">Check it</button><button class="go dim" id="br">Rewrite it as me</button></div><p class="fine">Check runs here against your rules file, up to 60,000 characters. Rewrite accepts up to 6,000 characters and sends the draft, rules and voice profile to Claude, then checks the result. Longer drafts are rejected in full.</p>`);

function openReview(){const l=E.filter(e=>e.stale);sheet(K('Review')+`<h1>Still true?</h1><p style="font-size:18px;color:var(--mid)">These notes say something is unfinished and have not been touched in two weeks. Your answer is kept here. The note files are not changed.</p><div class="big" id="rn">${l.length}</div>`,

async function openAudit(){sheet(K('Audit')+`<h1>Audit my work</h1><p style="font-size:18px;color:var(--mid)">Read only. It runs git read commands and reads tracked text files in the repos you listed. It writes nothing and deletes nothing.</p><div class="big" id="an">…</div><p class="fine" id="ar">Reading</p>`,'<div style="height:40px"></div>');thinkT=1;let j;try{j=await(await api('audit',{})).json()}catch(e){j={findings:[],read:[]}}thinkT=0;if(!$('#an'))return;

function openProposals(){const l=S.proposals||[];sheet(K('Proposed')+`<h1>Keep these?</h1><p style="font-size:18px;color:var(--mid)">Found in your repos or noticed by your coding sessions. Nothing is part of the twin until you accept it.</p><div class="big" id="pc">${l.length}</div>`,

 $$('#out [data-p]').forEach(b=>b.onclick=async()=>{const jr=await(await api('proposal',{id:+b.dataset.p,uid:b.dataset.u,revision:b.closest('.f').dataset.revision,old_id:b.dataset.o||null,old_revision:b.dataset.oldRevision||null,accept:!!b.dataset.a,replace:!!b.dataset.r})).json();if(jr.error){await refresh(true);return openProposals()}b.closest('.f').remove();await refresh(true);$('#pc').textContent=(S.proposals||[]).length})}
function openKeys(){sheet(K('Help')+`<h1>What this is</h1><p style="font-size:18px;color:var(--mid)">A twin of you that lives on your Mac. The head is your memory: every dot belongs to one note about how you decide, what you like, how you write, your work and your limits. The sides show your work right now. Ask it, hand it a draft, correct it. It keeps what you teach it.</p>`,

async function openSetup(n){stepN=n||0;const c=await(await api('config',{})).json();const draw=()=>{sheet(K('Setup')+`<h1>Make it yours</h1>`+[['Face',c.head?`${c.head.toLocaleString()} dots, built from a photo`:'No head yet'],['Voice',c.voice_name||(c.has_voice_key?'Not chosen':'No ElevenLabs key')],['Notes',`${c.notes} notes · ${c.name}`]].map(([a,b],i)=>`<button class="step ${i===stepN?'sel':''}" data-s="${i}"><i>${i+1}</i><div><b>${a}</b><span>${esc(b)}</span></div></button>`).join('')+`<p class="fine">Choose which sources to read and which services to use.</p>`);
  $$('.step').forEach(b=>b.onclick=()=>{stepN=+b.dataset.s;draw()});[face,voice,notes][stepN]()};
 const face=()=>{$('#out').innerHTML=`<div style="height:34px"></div>`+K('Step 1')+`<h3 class="go" style="color:var(--fg);padding:0">One photo becomes the head</h3><label id="drop"><input type="file" accept="image/*" hidden id="pf"><span id="dl">Drop a photo here, or click to choose</span></label><p style="color:var(--mid)">Front-facing, even light, head and shoulders. Use your own face, or one you have written consent for.</p><p style="color:var(--mid);margin-top:10px">Choosing a photo checks a temporary copy here. Missing model files may download from GitHub. Build sends the cut-out to fal on your account and keeps build files here.</p><label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;cursor:pointer"><input type="checkbox" id="pok" style="width:18px;height:18px;accent-color:#E4552A;margin-top:3px;flex:none"><span>This is a photo of me, or I have written consent from the person in it.</span></label><div class="acts"><button class="go" id="bb" disabled>Build my head</button></div><p class="fine" id="ps">${c.has_fal?'':'Needs FAL_KEY in the shell that starts the twin.'}</p>`;
  const coach=async f=>{$('#ps').textContent='Checking the photo';let j;try{j=await(await api('setup/check',f,1)).json()}catch(e){j={issues:['The photo check could not be reached.'],good:[]}}if(!$('#ps'))return;$('#ps').innerHTML=(j.issues||[]).length?'<span style="color:var(--sig)">Fix first: '+j.issues.map(esc).join(' · ')+'</span>':esc((j.good||['Good photo.']).join(' · '));$('#bb').textContent=(j.issues||[]).length?'Build anyway':'Build my head'};let file;const pick=f=>{if(!f||!/^image\//.test(f.type))return;file=f;$('#dl').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">${esc(f.name)}`;$('#bb').disabled=!c.has_fal;coach(f)};$('#pf').onchange=e=>pick(e.target.files[0]);const d=$('#drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');pick(e.dataTransfer.files[0])};
  $('#bb').onclick=async()=>{
   const button=$('#bb'),status=$('#ps');
   if(!$('#pok').checked){status.textContent='Tick the box first.';return}
   const stop=message=>{clearInterval(poll);thinkT=0;button.disabled=false;status.textContent=message};
   const result=async(route,body,raw)=>{
    const response=await api(route,body,raw),j=await response.json();
    if(!response.ok||j.error||!j.status)throw new Error(j.status||(typeof j.error==='string'&&j.error)||'The build did not return a status.');
    return j};
   button.disabled=true;thinkT=1;clearInterval(poll);
   try{const j=await result('setup/photo?consent=1',file,1);status.textContent=j.status}
   catch(e){stop('Could not confirm the build. '+e.message);return}
   let checking=false;
   poll=setInterval(async()=>{
    if(checking)return;checking=true;
    try{const j=await result('setup/status',{});status.textContent=j.status;
     if(j.done){clearInterval(poll);thinkT=0;sheet();await loadHead();assign();stF=[];boot=0}}
    catch(e){stop('Could not read the build result. '+e.message)}
    finally{checking=false}
   },2500)
  }};
 const voice=async()=>{$('#out').innerHTML=`<div style="height:34px"></div>`+K('Step 2')+`<h3 class="go" style="color:var(--fg);padding:0">Give it your voice</h3><p style="color:var(--mid);margin-bottom:14px">Click a voice to hear it. The system voice is free and stays on this machine. With a key, opening this list requests your account voices from ElevenLabs. A preview sends sample text. Speaking sends reply text unless it is already cached. Use your own voice, or one you have written consent for.</p><div id="vl">${c.has_voice_key?'Loading voices':'Set ELEVENLABS_API_KEY in the shell that starts the twin, then reload.'}</div><div id="vc"></div>`;if(!c.has_voice_key)return;
  if(c.can_clone)cloneUI(c,voice);else $('#vc').textContent='To clone a voice, set ELEVENLABS_API_KEY in the shell that starts the twin.';
  const j=await(await api('voices',{})).json(),l=[{voice_id:'',name:'No voice',category:'text only'}].concat(j.voices||[]);$('#vl').innerHTML=l.map(v=>`<button class="vrow ${v.voice_id===(c.voice_id||'')?'sel':''}" data-v="${esc(v.voice_id)}"><span class="dot"></span><b>${esc(v.name)}</b><span class="s">${esc(v.category)}</span></button>`).join('')||'No voices found on that account.';
  $$('.vrow').forEach(b=>b.onclick=async()=>{const id=b.dataset.v,r=await(await api('config',{voice_id:id})).json();Object.assign(c,r);$$('.vrow').forEach(x=>x.classList.toggle('sel',x===b));await refresh();if(id){vox=true;localStorage.vox=1;toggles();stopVoice();try{await playVoice('This is how your twin will sound.',id)}catch(e){}}})};
 const notes=()=>{$('#out').innerHTML=`<div style="height:34px"></div>`+K('Step 3')+`<h3 class="go" style="color:var(--fg);padding:0">Point it at your notes</h3><label class="lab k">Name on the wall</label><input class="fld" id="fn" maxlength="14" value="${esc(c.name)}"><label class="lab k">Folder of notes</label><input class="fld" id="fm" value="${esc(c.memory)}"><label class="lab k">Git repos it may read, one per line</label><textarea class="fld" id="fr" style="height:84px;min-height:0;border-top:0;padding:11px 0;font-size:16px" placeholder="~/code/my-project">${esc(c.repos||'')}</textarea><p style="color:var(--mid);margin-top:8px">A folder of Markdown files, one note per file. Claude Code memory folders work as they are. The twin reads them. It never edits them.</p><label class="lab k">Voice rules file</label><input class="fld" id="fu" value="${esc(c.rules||'')}"><p style="color:var(--mid);margin-top:6px">${c.rules_example?'These are the example rules, not yours. Build your own with the voice tools in this repo, then put the path here.':'Drafts are checked against this file.'}</p><label class="lab k">Voice profile file</label><input class="fld" id="fp" value="${esc(c.persona||'')}"><p style="color:var(--mid);margin-top:6px">${c.persona_example?'This is the example profile, not yours. Claude answers and Rewrite use this profile until you change it.':'Sent when you choose a Claude answer or Rewrite.'}</p><label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;cursor:pointer"><input type="checkbox" id="fs" ${c.read_sessions?'checked':''} style="width:18px;height:18px;accent-color:#E4552A;margin-top:3px;flex:none"><span>Also list my Claude Code sessions. This reads session records and transcript tails, including the last prompt, working folder, status and timing.</span></label><div class="acts"><button class="go" id="bs">Save and read them in</button><button class="go dim" id="bl">Learn from my repos</button></div><p class="fine" id="ns">${esc(c.will_read||'')}</p>`;
  $('#bl').onclick=async()=>{$('#ns').textContent='Reading the instruction files of the repos you listed';let j;try{j=await(await api('scan',{})).json()}catch(e){j={read:[],proposed:0}}await refresh();if(j.proposed)return openProposals();$('#ns').textContent=j.read.length?'Read '+j.read.join(', ')+'. Nothing new to propose.':'No instruction files found in the repos you listed.'};
  $('#bs').onclick=async()=>{const r=await(await api('config',{name:$('#fn').value,memory:$('#fm').value,rules:$('#fu').value,persona:$('#fp').value,read_sessions:$('#fs').checked,repos:$('#fr').value})).json();if(r.error){$('#ns').textContent=r.error;return}Object.assign(c,r);await refresh(true);$('#ns').textContent=`Saved. ${r.notes} notes load from this folder.`;ingest();$$('.step span')[2].textContent=`${r.notes} notes · ${r.name}`}};
 draw()}

(async()=>{await Promise.all([loadHead(),refresh()]);assign();size();fitName();document.fonts.ready.then(fitName);requestAnimationFrame(frame);setInterval(()=>document.hidden||stepMode||refresh(),6000);if(gl&&!localStorage.ingested&&!/shot/.test(location.search)){localStorage.ingested=1;setTimeout(()=>ingest(),3000)}
 window.__twin={ingest,emptyHead,endIngest,startIngest:s=>{if(!ing)return;ing.t0=tAll;ing.dur=s;document.body.classList.remove('ing0')},openAudit,openProposals,ask,present,clearSay,openCheck,openReview,openSetup,openKeys,sheet,setSel,setLens,refresh,tl:()=>tl(),idx:id=>idx[id],

  get:()=>({boot,speak,words:words.length,shown,playing:!!au,hot,pin,N,E:E.length,think,glitch,you:$('#you').textContent,txt:$('#txt').textContent}),
